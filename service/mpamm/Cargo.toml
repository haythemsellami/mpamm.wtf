[package]
name = "mpamm"
version = "0.1.0"
description = "The mpamm.wtf service: event reader, trade pipeline, store and API, beside its Monad node"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mpamm-analytics = { path = "../crates/analytics" }
mpamm-api = { path = "../crates/api" }
mpamm-chain = { path = "../crates/chain" }
mpamm-core = { path = "../crates/core" }
mpamm-markouts = { path = "../crates/markouts" }
mpamm-pipeline = { path = "../crates/pipeline" }
mpamm-pricing = { path = "../crates/pricing" }
mpamm-quotes = { path = "../crates/quotes" }
mpamm-registry = { path = "../crates/registry" }
mpamm-ring = { path = "../crates/ring" }
mpamm-store = { path = "../crates/store" }
mpamm-types = { path = "../crates/types" }
mpamm-venues = { path = "../crates/venues" }
arc-swap = { workspace = true }
async-trait = { workspace = true }
indexmap = { workspace = true }
parking_lot = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { version = "0.6", features = ["fs", "compression-br", "compression-gzip"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
