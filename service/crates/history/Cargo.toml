[package]
name = "mpamm-history"
version = "0.1.0"
description = "History repairs and backfill: dated revisions replayed from the hosted archive pool"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mpamm-chain = { path = "../chain" }
mpamm-core = { path = "../core" }
mpamm-pipeline = { path = "../pipeline" }
mpamm-pricing = { path = "../pricing" }
mpamm-registry = { path = "../registry" }
mpamm-ring = { path = "../ring" }
mpamm-store = { path = "../store" }
mpamm-types = { path = "../types" }
futures-util = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
mpamm-types = { path = "../types" }
mpamm-venues = { path = "../venues" }
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
