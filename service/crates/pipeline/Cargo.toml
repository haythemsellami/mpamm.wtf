[package]
name = "mpamm-pipeline"
version = "0.1.0"
description = "Final blocks in strict order: RPC repair, venue decode, one commit per block"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mpamm-chain = { path = "../chain" }
mpamm-core = { path = "../core" }
mpamm-pricing = { path = "../pricing" }
mpamm-registry = { path = "../registry" }
mpamm-ring = { path = "../ring" }
mpamm-store = { path = "../store" }
mpamm-types = { path = "../types" }
arc-swap = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
