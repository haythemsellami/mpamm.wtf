[package]
name = "mpamm-api"
version = "0.1.0"
description = "Today's HTTP API and /stream WebSocket protocol (mpamm.v2.gzip / mpamm.v2.json), served by axum"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mpamm-registry = { path = "../registry" }
mpamm-types = { path = "../types" }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
bytes = "1"
flate2 = "1"
form_urlencoded = "1"
futures-util = { workspace = true }
hex = "0.4"
indexmap = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, features = ["macros"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "compression-deflate", "cors"] }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mpamm-analytics = { path = "../analytics" }
brotli = "8"
http-body-util = "0.1"
indexmap = { workspace = true }
# Tests compare parsed frames with the rows they were built from; without
# this serde_json may parse a long float an ulp off (a browser doesn't).
serde_json = { workspace = true, features = ["float_roundtrip"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tokio-tungstenite = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing-subscriber = { workspace = true }
