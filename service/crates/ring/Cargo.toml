[package]
name = "mpamm-ring"
version = "0.1.0"
description = "Execution-event ring: the service's event model, watch set, block assembly and commit states"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arc-swap = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

# The SDK reads a Linux shared-memory ring (hugetlbfs) and builds only there.
# Everything else in this crate is plain Rust, so block assembly and its
# consumers build and test on any platform.
[target.'cfg(target_os = "linux")'.dependencies]
monad-event-ring = { workspace = true }
monad-exec-events = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
serde_json = { workspace = true }
zstd = "0.13"
