[package]
name = "mpamm-store"
version = "0.1.0"
description = "SQLite store: trades, daily volume and gas, cursor, revisions; one transaction per final block"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mpamm-types = { path = "../types" }
rusqlite = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
