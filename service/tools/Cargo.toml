[package]
name = "mpamm-tools"
version = "0.1.0"
description = "Operator and verification tools: decode a block range, parity checks"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mpamm-tools"
path = "src/main.rs"

[dependencies]
mpamm-chain = { path = "../crates/chain" }
mpamm-core = { path = "../crates/core" }
mpamm-pipeline = { path = "../crates/pipeline" }
mpamm-pricing = { path = "../crates/pricing" }
mpamm-registry = { path = "../crates/registry" }
mpamm-ring = { path = "../crates/ring" }
mpamm-types = { path = "../crates/types" }
mpamm-venues = { path = "../crates/venues" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
