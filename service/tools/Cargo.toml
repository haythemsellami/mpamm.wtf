[package]
name = "mpamm-tools"
version = "0.1.0"
description = "Operator and verification tools: decode a block range, parity checks"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mpamm-tools"
path = "src/main.rs"

[dependencies]
mpamm-chain = { path = "../crates/chain" }
mpamm-core = { path = "../crates/core" }
mpamm-history = { path = "../crates/history" }
mpamm-markouts = { path = "../crates/markouts" }
mpamm-pipeline = { path = "../crates/pipeline" }
mpamm-pricing = { path = "../crates/pricing" }
mpamm-quotes = { path = "../crates/quotes" }
mpamm-registry = { path = "../crates/registry" }
mpamm-ring = { path = "../crates/ring" }
mpamm-store = { path = "../crates/store" }
mpamm-types = { path = "../crates/types" }
mpamm-venues = { path = "../crates/venues" }
clap = { workspace = true }
flate2 = "1"
futures-util = { workspace = true }
parking_lot = { workspace = true }
tokio-tungstenite = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
