[package]
name = "mpamm-reader"
version = "0.2.0"
description = "Execution-event reader: block timeline, arrival delay, gaps and their repair"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mpamm-ring = { path = "../crates/ring" }
mpamm-chain = { path = "../crates/chain" }
chrono = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
signal-hook = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
