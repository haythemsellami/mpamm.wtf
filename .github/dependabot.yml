# Keep dependencies current. This is a security-sensitive indexer (on-chain
# decode math, an HTTP/WS server) that had zero update automation before — a
# patched viem/express vuln would otherwise sit until noticed by hand.
#
# Committers are still required (CODEOWNERS ruleset on main), so nothing here
# auto-merges; these just open PRs for review.
version: 2
updates:
  # npm — one PR per weekly batch of minor/patch updates across all workspaces
  # (the root lockfile covers shared/server/web). Major bumps stay individual.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]
    # @types/node tracks the RUNTIME, and that is pinned to 24 in three places:
    # the Dockerfile's node:24-alpine stages, ci.yml's node-version, and the
    # root engines field. Types ahead of the runtime describe APIs that are not
    # there when the container runs — typecheck goes green and production
    # throws, and node:sqlite (still experimental) moves between majors. A major
    # here is a RUNTIME decision, so it ships with the runtime bump rather than
    # on its own (#46 proposed 26 against a Node 24 image).
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)

  # github-actions — pin checkout/setup-node to current versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor:
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: chore(ci)
