# Keep dependencies current. This is a security-sensitive indexer (on-chain
# decode math, an HTTP/WS server) that had zero update automation before — a
# patched viem/express vuln would otherwise sit until noticed by hand.
#
# Committers are still required (CODEOWNERS ruleset on main), so nothing here
# auto-merges; these just open PRs for review.
version: 2
updates:
  # npm — one PR per weekly batch of minor/patch updates across all workspaces
  # (the root lockfile covers shared/server/web). Major bumps stay individual.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]
    # @types/node tracks the runtime Node major. The runtime is pinned to 24 in
    # the Dockerfile's node:24-alpine stages and ci.yml's node-version (the root
    # "engines" field is a minimum, not a pin). Types ahead of the runtime can
    # describe APIs that aren't present in production (notably node:sqlite), so
    # Node/@types majors should ship together.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)

  # github-actions — pin checkout/setup-node to current versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor:
        update-types: [minor, patch]
    labels: [dependencies]
    commit-message:
      prefix: chore(ci)
