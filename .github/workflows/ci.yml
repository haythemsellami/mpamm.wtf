name: CI

# Verify every push + PR. Deployment is handled by Render's native GitHub
# auto-deploy (push to main → Render builds the Dockerfile + deploys).
#
# paths-ignore applies to PUSH only: docs/markdown/PaaS-blueprint edits can't
# affect typecheck, tests, the build, or the image, so on push to main (which
# triggers Render regardless) we skip the no-op verify to save runner minutes.
# pull_request ALWAYS runs — a docs-only PR still needs to produce a check run
# so it can satisfy a required-status-check rule on main (skipping the workflow
# entirely would leave the check missing and block the merge). `workflow_dispatch`
# remains the force-run escape hatch for a push that was skipped.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/CODEOWNERS'
      - 'LICENSE'
      - 'render.yaml'
      - 'railway.json'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · build · docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck (server + web)
        run: npm run typecheck

      - name: Tests (server — fixture-based, no network)
        run: npm -w server run test

      - name: Build frontend
        run: npm -w web run build

      # Build the production image so a broken Dockerfile fails CI.
      - name: Build Docker image
        run: docker build -t mpamm:ci .
