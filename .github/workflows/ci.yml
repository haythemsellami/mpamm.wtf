name: CI

# Verify every push + PR. Deployment is handled by Render's native GitHub
# auto-deploy (push to main → Render builds the Dockerfile + deploys).
#
# paths-ignore: docs/markdown/PaaS-blueprint edits can't affect typecheck,
# tests, the build, or the image, so they skip the pipeline entirely rather
# than burning runner minutes on a no-op verify. `workflow_dispatch` remains
# the escape hatch to force a run on such a change if ever needed.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/CODEOWNERS'
      - 'LICENSE'
      - 'render.yaml'
      - 'railway.json'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/CODEOWNERS'
      - 'LICENSE'
      - 'render.yaml'
      - 'railway.json'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · test · build · docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck (server + web)
        run: npm run typecheck

      - name: Tests (server — fixture-based, no network)
        run: npm -w server run test

      - name: Build frontend
        run: npm -w web run build

      # Build the production image so a broken Dockerfile fails CI.
      - name: Build Docker image
        run: docker build -t mpamm:ci .
